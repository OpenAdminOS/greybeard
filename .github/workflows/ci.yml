name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Use npm 11 to match the committed lockfile
        run: npm install -g npm@11
      - name: Install libsecret (Linux keyring for MSAL cache)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:style
