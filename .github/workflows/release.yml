name: Executable artifacts

# Build candidates only. Publishing requires platform signing, an authenticated
# release manifest, protected release approval, and clean-machine evidence.
on:
  push:
    paths:
      - "cli/**"
      - "graph/**"
      - "memory/**"
      - "scripts/**"
      - "package*.json"
      - ".agents/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate source
        run: npm run ci
      - name: Build executable
        run: npm run build:executable
      - name: Exercise executable outside checkout
        run: npm run test:executable
      - uses: actions/upload-artifact@v4
        with:
          name: greybeard-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/executable/greybeard-*
          if-no-files-found: error
