name: Executable artifacts

# Pushes build candidates. An explicit dispatch additionally signs the Windows
# executable. Publication is a separate operation after all jobs are green.
on:
  push:
    paths:
      - "cli/**"
      - "graph/**"
      - "memory/**"
      - "scripts/**"
      - "package*.json"
      - ".agents/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Prepare distributable 0.1.0 artifacts and require Ugurlabs Windows signing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      GREYBEARD_EXPECT_PLATFORM: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate source
        run: npm run ci
      - name: Build executable
        run: npm run build:executable
      - name: Sign Windows executable as Ugurlabs
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.release
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.GREYBEARD_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.GREYBEARD_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.GREYBEARD_SIGNING_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: signacc123
          certificate-profile-name: openadminos-public
          files: ${{ github.workspace }}\dist\executable\greybeard-win32-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          description: Greybeard 0.1
          description-url: https://github.com/ugurkocde/greybeard
          exclude-environment-credential: false
          exclude-azure-cli-credential: true
          trace: false
      - name: Verify Windows publisher, product version and trusted timestamp
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        run: ./scripts/windows-signature.ps1 -Operation verify -BinaryPath ./dist/executable/greybeard-win32-x64.exe -OutputPath ./dist/executable/windows-signature.json
      - name: Exercise final executable outside checkout
        run: npm run test:executable
      - name: Package distributable and verify archive
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: node scripts/package-release.mjs --release
      - name: Package candidate and verify archive
        if: github.event_name != 'workflow_dispatch' || !inputs.release
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: greybeard-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
