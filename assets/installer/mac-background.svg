<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Install Greybeard</title>
  <desc>Drag Greybeard into Applications, then open it from Applications.</desc>
  <rect width="640" height="400" fill="#f5f3ec"/>
  <path d="M0 2H640" stroke="#536b57" stroke-width="4"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#536b57">
    <text x="40" y="43" font-size="11" letter-spacing="2.1">GREYBEARD</text>
    <text x="600" y="43" font-size="11" text-anchor="end">0.1</text>
  </g>
  <text x="40" y="94" font-family="DejaVu Serif, serif" font-size="34" letter-spacing="-1.1" fill="#29372f">A little wisdom, installed.</text>
  <text x="41" y="126" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#566158">Drag Greybeard into Applications to get started.</text>
  <path d="M40 154H600" stroke="#d6dace"/>
  <!-- Finder supplies the real app and Applications icons and their labels.
       Centers match electron-builder.cjs; artwork never imitates click targets. -->
  <circle cx="176" cy="246" r="66" fill="#eceee5"/>
  <circle cx="464" cy="246" r="66" fill="#eceee5"/>
  <path d="M278 246H362M352 236L362 246L352 256" fill="none" stroke="#6d806e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 351H600" stroke="#d6dace"/>
  <text x="320" y="378" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#566158">Then open Greybeard from Applications.</text>
</svg>
